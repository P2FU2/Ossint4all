# Referência para Railway / produção com PostgreSQL externo.
# Em Railway, configure DATABASE_URL do plugin Postgres e rode
# web, worker e scheduler como serviços separados (1 réplica cada no início).

services:
  web:
    build: .
    command: ["python", "-m", "monitor_jus.main", "serve"]
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["python", "-m", "monitor_jus.main", "worker"]
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL}

  scheduler:
    build: .
    command: ["python", "-m", "monitor_jus.main", "schedule"]
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL}
