# Contrato confirmado pelo probe (2026-08-05) — Comunica API
# python -m monitor_jus.sources.djen.probe → data/outbox/djen_probe.json

base_url: "https://comunicaapi.pje.jus.br/api/v1/comunicacao"

params:
  text: texto
  lawyer_name: nomeAdvogado
  oab_number: numeroOab
  oab_state: ufOab
  process_number: numeroProcesso
  court: siglaTribunal
  available_from: dataDisponibilizacaoInicio
  available_until: dataDisponibilizacaoFim
  page: pagina
  size: itensPorPagina

defaults:
  size: 50
  max_size: 100   # API aceita até 100; size=200 é truncado no client

response:
  items_key: items
  total_key: count
  # Observações do probe:
  # - count pode saturar em 10000 em buscas amplas
  # - itensPorPagina=2 pode devolver mais itens (mínimo efetivo da API)
  # - campos úteis no item: id, hash, numero_processo, numeroprocessocommascara,
  #   data_disponibilizacao, siglaTribunal, texto, tipoComunicacao, link,
  #   destinatarios[], destinatarioadvogados[].advogado{nome,numero_oab,uf_oab}
