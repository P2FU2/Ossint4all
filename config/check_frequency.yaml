# Política de refresh DataJud (horas / dias)
default_hours: 24

regras:
  - id: publicacao_nova
    hours: 2
    when: publicacao_nova

  - id: ativo_recente
    hours: 18
    when: ativo_com_movimentacao_recente
    recent_days: 30

  - id: ocioso
    days: 5
    when: sem_movimentacao_longa
    idle_days: 30

  - id: arquivado
    days: 21
    when: arquivado_ou_baixado

backoff:
  on_429_hours: [1, 3, 6, 12, 24]
  on_5xx_hours: [1, 2, 4, 8, 16]
