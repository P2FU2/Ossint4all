# Schedules honrados pelo serviço `python -m monitor_jus.main schedule`
jobs:
  DJEN_POLL:
    enabled: true
    interval_minutes: 60
    overlap_hours: 48

  DIARY_SWEEP:
    enabled: true
    schedule: "daily"  # 06:30 America/Sao_Paulo

  PROCESS_REFRESH:
    enabled: true
    schedule: "every_30_minutes"  # lote due + refresh-cont se houver backlog

  NATIONAL_RECONCILIATION:
    enabled: true
    schedule: "weekly"  # cobertura/lacunas (não é assinatura/provider)

  HISTORICAL_DISCOVERY:
    enabled: true
    run_on_bootstrap: true

  DAILY_DIGEST:
    enabled: true
    schedule: "cron"  # SCHEDULE_CRON / SCHEDULE_HOUR
