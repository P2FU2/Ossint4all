# Configuração operacional editável pela UI (Acompanhamento → Disparar).
# Não use .env para estes valores — o painel grava aqui.

discovery:
  # Janela curta do botão Discovery / HISTORICAL_DISCOVERY (não confundir com Bootstrap)
  lookback_days: 90
  max_pages: 80
  search_oabs: true
  search_names: true
  search_processes: true
  search_companies: true

bootstrap:
  # Janela longa do Bootstrap (acervo histórico completo)
  lookback_days: 1095
  max_pages: 80
  # Após o DJEN: enriquecer no DataJud processos sem situação/classe
  complete_missing_capa: true
  # Eventos do bootstrap não vão para o digest (baseline)
  ignore_events_for_digest: true

poll:
  # Só o DJEN_POLL automático / incremental
  overlap_hours: 48
