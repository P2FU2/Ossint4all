<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar · OSINT4ALL</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="login-page">
  <form class="login-card" method="post" action="/login">
    <div class="brand-mark">OSINT4ALL</div>
    <p class="lede">Investigação em grafo com fontes públicas e oficiais.</p>
    {% if flash %}
    <div class="flash {{ flash.level }}">{{ flash.message }}</div>
    {% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label>Usuário
      <input name="username" autocomplete="username" required />
    </label>
    <label>Senha
      <input name="password" type="password" autocomplete="current-password" required />
    </label>
    <button type="submit">Entrar</button>
    <p class="fine">Uso jornalístico / OSINT. Sem bases restritas nem conteúdo privado.</p>
  </form>
</body>
</html>
