<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ app_name }}{% endblock %} · {{ brand }}</title>
  <link rel="stylesheet" href="/static/app.css" />
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        {{ brand }}
        <small>{{ app_name }}</small>
      </div>
      <a class="nav-link {% if nav == 'dashboard' %}active{% endif %}" href="/app">Visão geral</a>
      <a class="nav-link {% if nav == 'acompanhamento' %}active{% endif %}" href="/app/acompanhamento">Acompanhamento</a>
      <a class="nav-link {% if nav == 'status' %}active{% endif %}" href="/app/status">Status & etapas</a>
      <a class="nav-link {% if nav == 'processos' %}active{% endif %}" href="/app/processos">Acervo</a>
      <a class="nav-link {% if nav == 'eventos' %}active{% endif %}" href="/app/eventos">Novidades</a>
      <a class="nav-link {% if nav == 'historico' %}active{% endif %}" href="/app/historico">Histórico</a>
      <a class="nav-link {% if nav == 'criterios' %}active{% endif %}" href="/app/criterios">Critérios</a>
      {% if is_admin %}
      <a class="nav-link {% if nav == 'sistema' %}active{% endif %}" href="/app/sistema">Sistema</a>
      {% endif %}
      <div class="sidebar-foot">
        <div>{{ user.username }} · {{ user.role }}</div>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <button type="submit">Sair</button>
        </form>
      </div>
    </aside>
    <main class="main">
      {% if flash %}
      <div class="flash {{ flash.level }}">{{ flash.message }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
