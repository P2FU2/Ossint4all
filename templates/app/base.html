<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ app_name }}{% endblock %} · {{ brand }}</title>
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/app.css" />
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="/static/app.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        {{ brand }}
        <small>OSINT público</small>
      </div>
      <div class="nav-section">Investigação</div>
      <a class="nav-link {% if nav == 'casos' %}active{% endif %}" href="/app">Casos</a>
      <a class="nav-link {% if nav == 'nova' %}active{% endif %}" href="/app/nova">Nova investigação</a>
      <a class="nav-link {% if nav == 'ferramentas' %}active{% endif %}" href="/app/ferramentas">Mapa de ferramentas</a>
      {% if is_admin %}
      <div class="nav-section">Operação</div>
      <a class="nav-link {% if nav == 'admin' %}active{% endif %}" href="/app/admin">Fontes e auditoria</a>
      {% endif %}
      <div class="sidebar-foot">
        <div class="user-chip">{{ user.username }} · {{ user.role }}</div>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <button type="submit">Sair</button>
        </form>
      </div>
    </aside>
    <main class="main {% block main_class %}{% endblock %}">
      {% if flash %}
      <div class="flash {{ flash.level }}">{{ flash.message }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
