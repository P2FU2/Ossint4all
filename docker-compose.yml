services:
  web:
    build: .
    command: python -m osint4all.main serve --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///data/osint4all.db
    volumes:
      - osint4all-data:/app/data
  worker:
    build: .
    command: python -m osint4all.main worker
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///data/osint4all.db
    volumes:
      - osint4all-data:/app/data
    depends_on:
      - web

volumes:
  osint4all-data:
