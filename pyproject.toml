[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osint4all"
version = "0.1.0"
description = "Plataforma de investigação OSINT em grafo (fontes públicas e oficiais)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "jinja2>=3.1.4",
  "python-dotenv>=1.0.1",
  "croniter>=3.0.0",
  "openai>=1.55.0",
  "tenacity>=9.0.0",
  "python-multipart>=0.0.12",
  "bcrypt>=4.2.0",
  "itsdangerous>=2.2.0",
  "xhtml2pdf>=0.2.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
osint4all = "osint4all.main:app_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
